name: Snapshot Google Sheet

# Saves a copy of every sheet tab into /data each morning.
# Every change is a commit, so you can see (and restore) any earlier version.
on:
  schedule:
    - cron: "17 13 * * *"   # ~5–6 AM Pacific
  workflow_dispatch: {}      # "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/snapshot.mjs
      - name: Commit if data changed
        run: |
          git config user.name "sheet-snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Data snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
