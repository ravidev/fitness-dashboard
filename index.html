<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Ravi's Fitness Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%232a78d6'/><path d='M8 17h4l2-6 4 12 2-6h4' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Fitness Dashboard</h1>
      <span id="source" class="source"></span>
    </div>
    <nav id="tabs" class="tabs" aria-label="Sections">
      <a href="#overview">Overview</a>
      <a href="#sleep">Sleep</a>
      <a href="#nutrition">Nutrition</a>
      <a href="#training">Training</a>
      <a href="#body">Body</a>
      <a href="#races">Races</a>
    </nav>
    <div class="controls">
      <div class="seg" id="range" role="group" aria-label="Date range">
        <button data-days="7">7d</button>
        <button data-days="30">30d</button>
        <button data-days="90">90d</button>
        <button data-days="0">All</button>
      </div>
      <button id="theme" class="icon-btn" title="Toggle dark mode" aria-label="Toggle dark mode">☾</button>
      <button id="reload" class="icon-btn" title="Reload data" aria-label="Reload data">↻</button>
    </div>
  </header>

  <main id="app">
    <p class="loading">Loading your data…</p>
  </main>

  <footer class="foot">
    <span id="foot-note"></span>
    <a id="sheet-link" target="_blank" rel="noopener">Open Google Sheet ↗</a>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
