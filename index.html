<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Ravi's Fitness Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%232a78d6'/><path d='M8 17h4l2-6 4 12 2-6h4' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Fitness Dashboard</h1>
      <span id="source" class="source"></span>
    </div>
    <nav id="tabs" class="tabs" aria-label="Sections">
      <a href="#training">Training</a>
      <a href="#overview">Overview</a>
      <a href="#nutrition">Nutrition</a>
      <a href="#sleep">Sleep</a>
      <a href="#body">Body</a>
      <a href="#bp">BP</a>
      <a href="#history">History</a>
      <a href="#races">Races</a>
      <a href="#insights">Insights</a>
    </nav>
    <div class="controls">
      <div class="seg" id="range" role="group" aria-label="Date range">
        <button data-days="7">7d</button>
        <button data-days="30">30d</button>
        <button data-days="90">90d</button>
        <button data-days="365">1y</button>
        <button data-days="0">All</button>
      </div>
      <button id="theme" class="icon-btn" title="Toggle dark mode" aria-label="Toggle dark mode">☾</button>
      <button id="reload" class="icon-btn" title="Reload data" aria-label="Reload data">↻</button>
    </div>
  </header>

  <!-- Seasonal banner: shown between the dates in FD_CONFIG.festive, dismissible -->
  <div id="festive" class="festive" hidden role="region" aria-label="Thanksgiving greeting">
    <div class="fx" aria-hidden="true"><i class="leaf" style="--x:3%;--d:2.3s;--s:6.6s;--z:13px">🍁</i><i class="leaf" style="--x:10%;--d:5.7s;--s:6.4s;--z:13px">🍃</i><i class="leaf" style="--x:17%;--d:1.5s;--s:6.3s;--z:20px">🍁</i><i class="leaf" style="--x:24%;--d:1.7s;--s:8.2s;--z:13px">🍃</i><i class="leaf" style="--x:31%;--d:0.9s;--s:6.9s;--z:13px">🍃</i><i class="leaf" style="--x:38%;--d:4.1s;--s:6.2s;--z:15px">🍁</i><i class="leaf" style="--x:45%;--d:3.9s;--s:6.5s;--z:20px">🍂</i><i class="leaf" style="--x:52%;--d:3.8s;--s:8.3s;--z:15px">🍁</i><i class="leaf" style="--x:59%;--d:4.1s;--s:8.6s;--z:17px">🍁</i><i class="leaf" style="--x:66%;--d:3.8s;--s:6.3s;--z:13px">🍃</i><i class="leaf" style="--x:73%;--d:1.4s;--s:8.7s;--z:20px">🍁</i><i class="leaf" style="--x:80%;--d:3.3s;--s:9.7s;--z:17px">🍁</i><i class="leaf" style="--x:87%;--d:1.7s;--s:6.7s;--z:15px">🍁</i><i class="leaf" style="--x:94%;--d:4.0s;--s:8.1s;--z:17px">🍂</i></div>
    <div class="festive-row">
      <span class="tg-ic" aria-hidden="true">🦃</span>
      <div class="festive-text">
        <b>Happy Thanksgiving week!</b>
        <q>Grateful for strong legs, open roads and a full table, and most of all for the friends and family who make every mile worth it.</q>
      </div>
      <span class="tg-ic r" aria-hidden="true">🥧</span>
      <button id="festive-close" class="festive-close" aria-label="Hide Thanksgiving greeting">×</button>
    </div>
  </div>

  <main id="app">
    <p class="loading">Loading your data…</p>
  </main>

  <footer class="foot">
    <span id="foot-note"></span>
    <a id="sheet-link" target="_blank" rel="noopener">Open Google Sheet ↗</a>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
