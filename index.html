<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Ravi's Fitness Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%232a78d6'/><path d='M8 17h4l2-6 4 12 2-6h4' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Fitness Dashboard</h1>
      <span id="source" class="source"></span>
    </div>
    <nav id="tabs" class="tabs" aria-label="Sections">
      <a href="#training">Training</a>
      <a href="#overview">Overview</a>
      <a href="#nutrition">Nutrition</a>
      <a href="#sleep">Sleep</a>
      <a href="#body">Body</a>
      <a href="#bp">BP</a>
      <a href="#history">History</a>
      <a href="#races">Races</a>
      <a href="#insights">Insights</a>
    </nav>
    <div class="controls">
      <div class="seg" id="range" role="group" aria-label="Date range">
        <button data-days="7">7d</button>
        <button data-days="30">30d</button>
        <button data-days="90">90d</button>
        <button data-days="365">1y</button>
        <button data-days="0">All</button>
      </div>
      <button id="theme" class="icon-btn" title="Toggle dark mode" aria-label="Toggle dark mode">☾</button>
      <button id="reload" class="icon-btn" title="Reload data" aria-label="Reload data">↻</button>
    </div>
  </header>

  <!-- Seasonal banner: shown between the dates in FD_CONFIG.festive, dismissible -->
  <div id="festive" class="festive" hidden role="region" aria-label="Rainy season greeting">
    <div class="fx" aria-hidden="true">
      <span class="cloud c1"></span><span class="cloud c2"></span><span class="cloud c3"></span>
      <i class="drop" style="--x:3%;--d:0s;--s:0.85s"></i><i class="drop" style="--x:9%;--d:0.5s;--s:1s"></i><i class="drop" style="--x:15%;--d:0.2s;--s:0.8s"></i><i class="drop" style="--x:21%;--d:0.7s;--s:0.95s"></i><i class="drop" style="--x:27%;--d:0.1s;--s:0.9s"></i><i class="drop" style="--x:33%;--d:0.6s;--s:0.82s"></i><i class="drop" style="--x:39%;--d:0.3s;--s:1.05s"></i><i class="drop" style="--x:45%;--d:0.8s;--s:0.88s"></i><i class="drop" style="--x:51%;--d:0.15s;--s:0.92s"></i><i class="drop" style="--x:57%;--d:0.55s;--s:0.8s"></i><i class="drop" style="--x:63%;--d:0.35s;--s:1s"></i><i class="drop" style="--x:69%;--d:0.75s;--s:0.86s"></i><i class="drop" style="--x:75%;--d:0.05s;--s:0.94s"></i><i class="drop" style="--x:81%;--d:0.45s;--s:0.84s"></i><i class="drop" style="--x:87%;--d:0.25s;--s:1.02s"></i><i class="drop" style="--x:93%;--d:0.65s;--s:0.9s"></i><i class="drop" style="--x:98%;--d:0.4s;--s:0.87s"></i><i class="drop" style="--x:12%;--d:0.9s;--s:0.97s"></i><i class="drop" style="--x:36%;--d:0.95s;--s:0.83s"></i><i class="drop" style="--x:60%;--d:0.85s;--s:0.99s"></i><i class="drop" style="--x:84%;--d:0.12s;--s:0.91s"></i>
      <i class="ripple" style="--x:8%;--d:0s"></i><i class="ripple" style="--x:23%;--d:1.1s"></i><i class="ripple" style="--x:41%;--d:0.6s"></i><i class="ripple" style="--x:58%;--d:1.7s"></i><i class="ripple" style="--x:74%;--d:0.3s"></i><i class="ripple" style="--x:90%;--d:1.4s"></i>
    </div>
    <div class="festive-row">
      <span class="rcloud" aria-hidden="true"><i></i><i></i><i></i></span>
      <div class="festive-text">
        <b>Rainy days are here</b>
        <span>Grey skies and wet roads. Trainer rides, treadmill miles and cozy recovery days all count. Stay dry, keep moving.</span>
      </div>
      <span class="rcloud" aria-hidden="true"><i></i><i></i><i></i></span>
      <button id="festive-close" class="festive-close" aria-label="Hide rainy day banner">×</button>
    </div>
  </div>

  <main id="app">
    <p class="loading">Loading your data…</p>
  </main>

  <footer class="foot">
    <span id="foot-note"></span>
    <a id="sheet-link" target="_blank" rel="noopener">Open Google Sheet ↗</a>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
